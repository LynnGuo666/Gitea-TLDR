[project]
name = "gitea-tldr"
version = "2.4.0"
description = "基于多引擎的 Gitea Pull Request 自动审查工具（默认 Forge 引擎，CLI legacy extras 按需启用）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LynnGuo666" }]
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.51.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "aiosqlite==0.22.1",
    "greenlet==3.5.4",
    "PyNaCl==1.6.2",
    "jieba==0.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"app/review/providers/forge/tools/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = ["valid-type"]
